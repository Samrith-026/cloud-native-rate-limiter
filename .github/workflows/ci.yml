name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests
        run: mvn --batch-mode verify
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate load generator syntax
        run: python -m py_compile scripts/load_test.py
      - name: Build container image
        run: docker build --tag cloud-native-rate-limiter:ci .

