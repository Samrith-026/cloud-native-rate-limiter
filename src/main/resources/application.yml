spring:
  application:
    name: cloud-native-rate-limiter
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 750ms

rate-limit:
  capacity: ${RATE_LIMIT_CAPACITY:20}
  window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash

server:
  shutdown: graceful
